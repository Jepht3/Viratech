name: Applications Android

# Se déclenche uniquement quand le dossier mobile/ a changé (ou à la demande depuis l'onglet Actions).
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: applications-android
  cancel-in-progress: true

env:
  # Adresse du serveur pour lequel les applications sont construites (variable du dépôt APP_DOMAINE).
  API_URL: https://${{ vars.APP_DOMAINE || 'viratech.example' }}

jobs:
  construire:
    name: Analyse, compilation des deux APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Clé de signature : fournie par les secrets du dépôt, jamais dans le code. Sans elle, APK signés avec la clé de débogage (tests seulement).
      - name: Clé de signature (si les secrets existent)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eo pipefail
          if [ -z "$KEYSTORE_B64" ]; then echo "Aucun secret de signature : APK de test."; exit 0; fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t"' | base64 -d > android/upload.jks
          STORE_PW="$(printf '%s' "$STORE_PW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n ')"
          ESC_PW="$(printf '%s' "$STORE_PW" | sed 's/\\/\\\\/g')"
          {
            printf 'storePassword=%s\n' "$ESC_PW"
            printf 'keyPassword=%s\n' "$ESC_PW"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload.jks\n'
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      # Le numéro de build augmente tout seul à chaque exécution.
      - name: Construire Viratech (client) et Viratech Admin
        run: |
          BASE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          VERSION="${BASE%.*}.${{ github.run_number }}"
          echo "Version : $VERSION"
          DEFS="--build-number=${{ github.run_number }} --build-name=$VERSION --dart-define=APP_VERSION=$VERSION --dart-define=API_URL=$API_URL --dart-define=BUILD_NUMBER=${{ github.run_number }}"
          flutter build apk --release --flavor client $DEFS
          flutter build apk --release --flavor admin  $DEFS -t lib/main_admin.dart

      - name: Préparer les fichiers
        run: |
          mkdir -p ../apk
          cp build/app/outputs/flutter-apk/app-client-release.apk ../apk/viratech.apk
          cp build/app/outputs/flutter-apk/app-admin-release.apk  ../apk/viratech-admin.apk
          BASE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          VERSION="${BASE%.*}.${{ github.run_number }}"
          NOTES=$(grep -v '^[[:space:]]*$' nouveautes.txt 2>/dev/null | head -5 | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin]))' || echo '[]')
          echo "{\"version\":\"${VERSION}\",\"build\":${{ github.run_number }},\"date\":\"$(date +%F)\",\"notes\":${NOTES}}" > ../apk/version.json

      # Copie téléchargeable depuis l'onglet Actions (14 jours). La publication sur le serveur sera ajoutée une fois le serveur installé.
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: apk/
          retention-days: 14
